[package]
name = "lumec_core"
version = "0.1.0"
edition = "2024"

[dependencies]
inkwell = { version = "0.11.0", features = ["llvm23-1"] }
libffi = "5.2.0"
libloading = "0.8.9"
self_cell = "1.2"
lumec_immix = { path = "../lumec_immix" }

[features]
default = []
system-sleef = []

[[bin]]
name = "lume-bootstrap"
path = "src/main.rs"
