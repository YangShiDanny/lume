name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Rust + Lume + VS Code
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 安装 LLVM 23
        shell: bash
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors \
            -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23-dev clang-23
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          llvm-config-23 --version

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path crates/lumec_core/Cargo.toml -- --check

      - name: 运行 Rust 测试
        run: cargo test --workspace

      - name: 运行 Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 构建 Release 版本
        run: cargo build --workspace --release

      - name: 检查并运行 Lume 示例
        run: |
          cargo run -p lumec_core -- check examples/demo_basic/src/main.lume
          cargo run -p lumec_core -- run examples/demo_basic/src/main.lume
          cargo run -p lumec_core -- run examples/demo_math_logging.lume

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode‑lume/package-lock.json

      - name: 编译 VS Code 扩展
        working-directory: editor/vscode‑lume
        run: |
          npm ci
          npm run compile

  build-web:
    name: 构建并部署积木编辑器
    runs-on: ubuntu-24.04
    concurrency:
      group: lume-pages-deploy
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/blockly-lume/package-lock.json

      - name: 安装依赖
        working-directory: editor/blockly-lume
        run: npm ci

      - name: 构建网页
        working-directory: editor/blockly-lume
        env:
          VITE_BASE_URL: ${{ vars.PAGES_BASE_URL || '/LumeC/' }}
        run: npm run build

      - name: 检查 Pages 令牌
        id: pages_token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -n "$PAGES_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.PAGES_TOKEN，跳过 Pages 部署。"
          fi

      - name: 部署到 <用户名>.github.io/LumeC/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pages_token.outputs.has_token == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: ${{ vars.PAGES_REPO || format('{0}/{0}.github.io', github.repository_owner) }}
          publish_branch: ${{ vars.PAGES_BRANCH || 'main' }}
          publish_dir: ./editor/blockly-lume/dist
          destination_dir: ${{ vars.PAGES_DEST_DIR || 'LumeC' }}
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
