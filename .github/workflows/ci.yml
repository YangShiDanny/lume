name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Rust + Lume (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            llvm-script: .github/scripts/setup-llvm-linux.sh
            exe: lume-bootstrap
          - os: macos-15
            llvm-script: .github/scripts/setup-llvm-macos.sh
            exe: lume-bootstrap
          - os: windows-2022
            llvm-script: .github/scripts/setup-llvm-windows.ps1
            exe: lume-bootstrap.exe
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 安装 LLVM 23 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash "${{ matrix.llvm-script }}"

      - name: 缓存 LLVM 23 安装包 (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-23.tar.xz
          key: llvm-23-archive-${{ vars.LLVM_VERSION || '23.1.6' }}-v1

      - name: 安装 LLVM 23 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LLVM_VERSION: ${{ vars.LLVM_VERSION || '23.1.6' }}
          LLVM_BASE_URL: ${{ vars.LLVM_BASE_URL || '' }}
          LLVM_DOWNLOAD_URL: ${{ vars.LLVM_DOWNLOAD_URL || '' }}
        run: .\${{ matrix.llvm-script }}

      - name: 检查 Rust 格式
        shell: bash
        run: cargo fmt --manifest-path crates/lumec_core/Cargo.toml -- --check

      - name: 运行 Rust 测试
        shell: bash
        run: cargo test --workspace

      - name: 运行 Clippy
        shell: bash
        # 临时放行三个纯风格 lint，等手头的 FFI/GC 改完再逐条改成 inspect/zip/去掉 return。
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::manual_inspect -A clippy::manual_option_zip -A clippy::needless_return

      - name: 构建 Release 版本
        shell: bash
        run: cargo build --workspace --release

      - name: 检查并运行 Lume 示例
        shell: bash
        run: |
          BIN="target/release/${{ matrix.exe }}"
          "$BIN" check examples/demo_basic/src/main.lume
          "$BIN" run examples/demo_basic/src/main.lume
          "$BIN" run examples/demo_math_logging.lume
          "$BIN" jit examples/demo_basic/src/main.lume
          "$BIN" jit examples/demo_llvm_jit.lume
          "$BIN" llvm-ir examples/demo_llvm_jit.lume

  build-vscode:
    name: VS Code 扩展
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode‑lume/package-lock.json

      - name: 编译 VS Code 扩展
        working-directory: editor/vscode‑lume
        run: |
          npm ci
          npm run compile

  build-web:
    name: 构建并部署积木编辑器
    runs-on: ubuntu-24.04
    concurrency:
      group: lume-pages-deploy
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/blockly-lume/package-lock.json

      - name: 安装依赖
        working-directory: editor/blockly-lume
        run: npm ci

      - name: 构建网页
        working-directory: editor/blockly-lume
        env:
          VITE_BASE_URL: ${{ vars.PAGES_BASE_URL || '/LumeC/' }}
        run: npm run build

      - name: 检查 Pages 令牌
        id: pages_token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -n "$PAGES_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.PAGES_TOKEN，跳过 Pages 部署。"
          fi

      - name: 部署到 <用户名>.github.io/LumeC/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pages_token.outputs.has_token == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: ${{ vars.PAGES_REPO || format('{0}/{0}.github.io', github.repository_owner) }}
          publish_branch: ${{ vars.PAGES_BRANCH || 'main' }}
          publish_dir: ./editor/blockly-lume/dist
          destination_dir: ${{ vars.PAGES_DEST_DIR || 'LumeC' }}
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
