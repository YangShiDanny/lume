name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许这个 job 拿到 Pages 的部署权限，并取消正在跑的旧部署（防止并发冲突）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 落地页是 docs/ 下的纯静态单文件，零构建依赖，直接上传即可。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
