name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: lume-windows
            bin: lume.exe
            target: ""
            package: zip
          - os: ubuntu-latest
            artifact: lume-linux
            bin: lume
            target: ""
            package: tar.gz
          - os: macos-latest
            artifact: lume-macos
            bin: lume
            target: ""
            package: tar.gz
          - os: ubuntu-latest
            artifact: lume-alpine
            bin: lume
            target: x86_64-unknown-linux-musl
            package: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Windows icon resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path assets/lume.ico)) {
            throw "Missing assets/lume.ico"
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install clang (Linux glibc)
        if: runner.os == 'Linux' && matrix.target == ''
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev

      - name: Install musl toolchain (Alpine target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release
          fi

      - name: Verify static (Alpine)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file target/${{ matrix.target }}/release/lume
          ldd target/${{ matrix.target }}/release/lume 2>&1 || echo "static"

      # ── 打包 ──

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage/lume-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/lume.exe $stage/
          Copy-Item scripts/install.ps1 $stage/
          if (Test-Path README.md) { Copy-Item README.md $stage/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE $stage/ }
          Compress-Archive -Path "$stage/*" -DestinationPath "lume-windows.zip" -Force
          Write-Host "打包完成："
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="${{ matrix.bin }}"
          if [ -n "${{ matrix.target }}" ]; then
            bin_path="target/${{ matrix.target }}/release/$bin"
          else
            bin_path="target/release/$bin"
          fi
          stage="stage/${{ matrix.artifact }}"
          mkdir -p "$stage"
          cp "$bin_path" "$stage/"
          [ -f README.md ] && cp README.md "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/"
          chmod +x "$stage/$bin"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C stage "${{ matrix.artifact }}"
          echo "打包完成："
          tar -tzf "${{ matrix.artifact }}.tar.gz"

      # ── 上传 ──

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: lume-windows.zip

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz