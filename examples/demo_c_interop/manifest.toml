[project]
name = "demo_c_interop"
version = "0.1.0"
build_mode = "jit"

[[module]]
path = "src/main.lume"
lang = "lume"
export = ["calc_sum", "entry"]

[[module]]
path = "src/calc.c"
lang = "c"
cflags = ["-O1"]
export = ["c_matmul"]

[ffi.export]
export = ["calc_sum"]

[ffi.extern]
c_matmul = { params = ["i64", "pointer"], ret = "i64" }
